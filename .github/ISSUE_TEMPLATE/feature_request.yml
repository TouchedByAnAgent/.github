name: Feature request
description: Suggest a change or an addition
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Do not post Bluetooth addresses, serial numbers or other device identifiers. Support for a device is only claimed after it has been validated against that device.
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What problem does it solve?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device model, if the request concerns a specific device
      description: Say whether you can test against it.
